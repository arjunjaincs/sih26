[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pramaan"
version = "1.0.0"
description = "PRAMAAN — Evidence Before Trust. Offline CV integrity assurance."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "Pillow>=10.3.0",
    "ImageHash>=4.3.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Model-analysis extras — optional so the core package installs without them.
# Install with: pip install -e ".[models]"
models = [
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "torch>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "security: Security-critical tests",
    "reproducibility: Reproducibility verification",
    "slow: Tests that take > 5 seconds",
    "integration: Integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI depends-as-default is idiomatic

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
